name: Multi-Platform Build & Release (Windows, macOS, Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      use_pyarmor:
        description: 'Enable PyArmor obfuscation before PyInstaller build'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build (${{ matrix.platform_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: payroll-windows
            platform_name: Windows
            platform: windows
          - os: macos-latest
            artifact_name: payroll-macos
            platform_name: macOS
            platform: macos
          - os: ubuntu-latest
            artifact_name: payroll-linux
            platform_name: Linux
            platform: linux

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linux System Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgirepository1.0-dev file wget desktop-file-utils
          sudo apt-get install -y gir1.2-webkit2-4.1 || sudo apt-get install -y gir1.2-webkit2-4.0 || true
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt pyinstaller

      - name: Run Test Suite
        run: |
          python test_payroll.py

      - name: Obfuscate Code with PyArmor (If Enabled)
        if: ${{ github.event.inputs.use_pyarmor == true || github.event.inputs.use_pyarmor == 'true' }}
        run: |
          pip install pyarmor
          python -m pyarmor.cli gen --pack "PayGuard.spec" app.py database.py zkteco_parser.py payroll_engine.py exporter.py pdf_generator.py

      - name: Build Executable with PyInstaller (Standard Mode)
        if: ${{ !(github.event.inputs.use_pyarmor == true || github.event.inputs.use_pyarmor == 'true') }}
        run: |
          pyinstaller --noconfirm PayGuard.spec

      # Prepare distribution packages per platform
      - name: Package Windows Binary
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist_package" -Force
          Copy-Item "dist\PayGuard.exe" "dist_package\PayGuard-Windows-x64.exe"
          Copy-Item "sample_data\sample_punches.txt" "dist_package\sample_punches.txt" -ErrorAction SilentlyContinue
          Get-ChildItem dist_package

      - name: Package macOS Application
        if: matrix.platform == 'macos'
        run: |
          mkdir -p dist_package
          cd dist
          if [ -d "PayGuard.app" ]; then
            zip -r -y "../dist_package/PayGuard-macOS-Universal.zip" PayGuard.app
          fi
          if [ -f "PayGuard" ]; then
            cp PayGuard "../dist_package/PayGuard-macOS-cli"
          fi
          cd ..
          cp "sample_data/sample_punches.txt" dist_package/ || true
          ls -lh dist_package/

      - name: Package Linux Binary & AppImage
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist_package
          cd dist
          chmod +x PayGuard
          tar -czvf "../dist_package/PayGuard-Linux-x86_64.tar.gz" PayGuard
          cd ..
          cp "sample_data/sample_punches.txt" dist_package/ || true

          # Build AppImage for Linux
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/PayGuard AppDir/usr/bin/PayGuard

          cat << 'EOF' > AppDir/payguard.desktop
          [Desktop Entry]
          Type=Application
          Name=PayGuard
          Comment=Smart Payroll & Biometric Attendance System
          Exec=PayGuard
          Icon=payguard
          Categories=Office;Finance;
          Terminal=false
          EOF

          cat << 'EOF' > AppDir/usr/share/icons/hicolor/256x256/apps/payguard.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="256" height="256" fill="#2563eb"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4" fill="none" stroke="#ffffff" stroke-width="2"/></svg>
          EOF
          cp AppDir/usr/share/icons/hicolor/256x256/apps/payguard.svg AppDir/payguard.svg

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/PayGuard" "$@"
          EOF
          chmod +x AppDir/AppRun

          # Download appimagetool and generate AppImage using extracted tool (FUSE-independent)
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          ARCH=x86_64 ./squashfs-root/AppRun -n AppDir "dist_package/PayGuard-Linux-x86_64.AppImage"
          chmod +x dist_package/PayGuard-Linux-x86_64.AppImage
          ls -lh dist_package/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist_package/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: payroll-windows
          path: release_assets/windows

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: payroll-macos
          path: release_assets/macos

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: payroll-linux
          path: release_assets/linux

      - name: Flatten Release Assets
        run: |
          mkdir -p final_assets
          find release_assets/ -type f -exec cp {} final_assets/ \;
          echo "Files to release:"
          ls -la final_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: PayGuard ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: final_assets/*
          body: |
            ## 🛡️ PayGuard ${{ github.ref_name }} — Multi-Platform Release

            Automated cross-platform builds for **PayGuard** (Smart Payroll & Biometric Attendance System).

            ### 📦 Download Packages:
            - **Windows (x64)**: `PayGuard-Windows-x64.exe` (Standalone executable, no install required).
            - **macOS (Universal / Apple Silicon & Intel)**: `PayGuard-macOS-Universal.zip` (Contains `PayGuard.app`).
            - **Linux (x86_64)**: `PayGuard-Linux-x86_64.AppImage` (Run on any modern Linux distribution) or `PayGuard-Linux-x86_64.tar.gz`.

            ---

            ### 🍎 Note for macOS Users:
            Because this application is not signed with an Apple Developer certificate, macOS Gatekeeper may show an *"unidentified developer"* or *"app cannot be opened"* notice on first launch.
            **How to open on macOS:**
            1. Unzip `PayGuard-macOS-Universal.zip`.
            2. Right-click on `PayGuard.app` and choose **Open**, then click **Open** in the dialog.
            3. Alternatively: Go to **System Settings → Privacy & Security** and click **Open Anyway**.
